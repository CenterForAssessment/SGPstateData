name: build-check

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  rebuild-matches-committed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install packages
        run: Rscript -e 'install.packages(c("data.table", "digest", "png", "SGP"))'
      - name: A fresh build reproduces the committed SGPstateData.rda
        run: Rscript scripts/check.R
      - name: Compare with the copy in the SGP package (report only)
        continue-on-error: true
        run: |
          curl -fsSL https://raw.githubusercontent.com/CenterForAssessment/SGP/master/data/SGPstateData.rda -o "$RUNNER_TEMP/SGP_SGPstateData.rda"
          Rscript scripts/check.R --built=SGPstateData.rda --against="$RUNNER_TEMP/SGP_SGPstateData.rda"
