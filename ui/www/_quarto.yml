# Generated by dataimago::create_package_site(). Re-running with overwrite_config = FALSE keeps edits.
project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "reference/*.qmd"
    - "articles/**/*.qmd"
  resources:
    - assets/fonts/*.woff2

execute:
  freeze: auto

website:
  title: "SGPstateData"
  description: "State Assessment Program Meta-Data for the SGP Package"
  site-url: "https://centerforassessment.github.io/SGPstateData/"
  repo-url: "https://github.com/CenterForAssessment/SGPstateData"
  favicon: assets/brand/favicon.png
  open-graph: true
  page-navigation: false
  search:
    location: navbar
    type: overlay
  navbar:
    title: "SGPstateData"
    logo: assets/brand/logo.svg
    logo-alt: "SGPstateData hex logo"
    pinned: false
    left:
      - href: index.qmd
        text: Home
      - href: reference/index.qmd
        text: Reference
      - href: articles/index.qmd
        text: Articles
      - href: news.qmd
        text: News
      - href: citation.qmd
        text: Citation
    right:
      - icon: github
        href: https://github.com/CenterForAssessment/SGPstateData
        aria-label: "SGPstateData on GitHub"
  page-footer:
    left: "© 2026 Damian W. Betebenner · Center for Assessment"
    right:
      - text: "Center for Assessment"
        href: https://www.nciea.org/
      - text: "Design system"
        href: https://dataimago.ai

format:
  pkgsite-html:
    css: assets/css/fonts.css
    toc: true
    toc-depth: 3
    page-layout: article
    lang: en
